autoInstallPeers: false

catalog:
  oxlint: ^1.67.0

overrides:
  '@types/node>undici-types': '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - oxlint-tsgolint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - ast-v8-to-istanbul@1.0.2
  - tinyexec@1.2.2

updateConfig:
  ignoreDependencies:
    - '@types/node'
