autoInstallPeers: false

blockExoticSubdeps: true

catalog:
  oxlint: ^1.58.0

onlyBuiltDependencies:
  - esbuild

overrides:
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'

peerDependencyRules:
  allowAny:
    - oxlint-tsgolint
    - typescript
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
