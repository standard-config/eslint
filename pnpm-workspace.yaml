autoInstallPeers: false

blockExoticSubdeps: true

catalog:
  oxlint: ^1.60.0

overrides:
  '@types/node>undici-types': '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'

peerDependencyRules:
  allowAny:
    - oxlint-tsgolint
    - vitest

strictDepBuilds: true

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
