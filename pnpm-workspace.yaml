autoInstallPeers: false

catalog:
  oxlint: ^1.64.0

minimumReleaseAgeExclude:
  - '@standard-config/*'
  - eslint
  - oxlint

overrides:
  '@types/node>undici-types': '-'
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: 'catalog:'

peerDependencyRules:
  allowAny:
    - '@vitest/coverage-v8'
    - oxlint-tsgolint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

updateConfig:
  ignoreDependencies:
    - '@types/node'
